<!DOCTYPE html>
<html>

<head>

<style>

/* Element Selector */
h1 {

    color: red;

}

/* ID Selector */
#title {

    background-color: yellow;

}

/* Class Selector */
.text {

    color: blue;

}

/* Universal Selector */
* {

    font-family: Arial;

}

/* Group Selector */
h2, p {

    border: 2px solid black;

}

</style>

</head>

<body>

<h1 id="title">
    CSS Selectors
</h1>

<h2>
    Frontend Development
</h2>

<p class="text">
    Learning CSS
</p>

</body>

</html>
