<!DOCTYPE html>
<html>

<head>

<style>

h1 {

    border: 5px solid red;

}

p {

    border: 4px dashed blue;

}

.box {

    border: 5px double green;

    border-radius: 20px;

    padding: 20px;

}

</style>

</head>

<body>

<h1>
    CSS Borders
</h1>

<p>
    Dashed Border Example
</p>

<div class="box">

    Rounded Border Example

</div>

</body>

</html>
